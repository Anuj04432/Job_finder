[project]
name = "job-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.1.0",
    "markitdown[docx,pdf]>=0.1.6",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",
    "spacy>=3.7.0",
    "streamlit>=1.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parser", "skills_gap", "keywords"]
